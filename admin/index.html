<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Área da noiva — Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair:ital,opsz,wght@0,5..1200,300..900;1,5..1200,300..900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="admin.css">
</head>
<body>
    <div class="pagina-login">
        <div class="card-login">
            <h1>Área da noiva</h1>
            <p class="subtitulo" id="admin-subtitulo-casal">Entre com o e-mail da sua conta</p>

            <form id="form-login">
                <label for="login">E-mail</label>
                <input type="text" id="login" autocomplete="username" required placeholder="seu@email.com">

                <label for="senha">Senha</label>
                <input type="password" id="senha" autocomplete="current-password" required>

                <button type="submit" class="btn-primario" id="btn-login">Entrar</button>
            </form>

            <p id="mensagem" class="mensagem"></p>
            <div class="links-login">
                <a href="../landing/index.html" class="link-voltar">Criar meu site</a>
                <a href="../index.html?site=modelo" class="link-voltar" target="_blank" rel="noopener">Ver modelo em branco</a>
                <a href="../index.html" class="link-voltar" target="_blank" rel="noopener">Ver demonstração</a>
            </div>
        </div>
    </div>

    <script src="../config.js"></script>
    <script src="admin.js"></script>
    <script>
        if (getToken()) {
            window.location.href = "painel.html";
        }

        const form = document.getElementById("form-login");
        const mensagem = document.getElementById("mensagem");
        const btnLogin = document.getElementById("btn-login");

        form.addEventListener("submit", async (e) => {
            e.preventDefault();
            mensagem.className = "mensagem";
            mensagem.textContent = "";
            btnLogin.disabled = true;
            btnLogin.textContent = "Entrando...";

            try {
                const login = document.getElementById("login").value.trim();
                const senha = document.getElementById("senha").value;
                const payload = JSON.stringify({ login, senha });

                // Tenta noiva (e-mail) e depois admin global
                let resposta = await fetch(`${API_BASE}/api/auth/login-noiva`, {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: payload
                });

                if (resposta.status === 401) {
                    resposta = await fetch(`${API_BASE}/api/auth/login`, {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: payload
                    });
                }

                const texto = await resposta.text();
                let dados;
                try { dados = JSON.parse(texto); } catch { dados = texto; }

                if (!resposta.ok) {
                    throw new Error(typeof dados === "string" ? dados : (dados.message || "Login ou senha inválidos"));
                }

                setAuth(dados.token, dados.login, dados.siteId || null, dados.role || "ADMIN");
                window.location.href = "painel.html";
            } catch (erro) {
                mensagem.className = "mensagem erro";
                mensagem.textContent = erro.message || "Erro ao fazer login.";
            } finally {
                btnLogin.disabled = false;
                btnLogin.textContent = "Entrar";
            }
        });
    </script>
</body>
</html>
